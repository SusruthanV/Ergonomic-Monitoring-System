services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ergoguard-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - backend-data:/app/data
      - mediapipe-cache:/root/.cache/mediapipe
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - ergoguard-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ergoguard-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ergoguard-net

volumes:
  backend-data:
  mediapipe-cache:

networks:
  ergoguard-net:
    driver: bridge
